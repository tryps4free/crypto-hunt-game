<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>My discoveries</title></head><body><div class="app-shell"><header class="topbar"><a class="brand-mini" href="/">◈ CRYPTO HUNT</a><a href="/">Dashboard</a></header><section class="welcome"><div><p class="eyebrow">PERSONAL LOG</p><h1>My discoveries</h1><p class="muted">Recent unique pages assigned to your account.</p></div></section><section class="table-card"><table><thead><tr><th>Network</th><th>Page</th><th>Result</th><th>Reward</th><th>Time (UTC)</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r['network']}}</td><td>#{{r['page_number']}}</td><td>{{r['result']}}</td><td>{{r['reward']}} VCOIN</td><td>{{r['created_at'][:19]}}</td></tr>{% else %}<tr><td colspan="5">No discoveries yet.</td></tr>{% endfor %}</tbody></table></section></div></body></html>
