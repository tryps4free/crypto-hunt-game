<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Admin</title></head><body><div class="app-shell"><header class="topbar"><a class="brand-mini" href="/">◈ CRYPTO HUNT</a><a href="/">Dashboard</a></header><section class="welcome"><div><p class="eyebrow">ADMIN</p><h1>Game overview</h1></div></section><section class="stats-grid"><div class="stat-card"><span>Users</span><strong>{{stats.users}}</strong></div><div class="stat-card"><span>Claimed pages</span><strong>{{stats.claimed}}</strong></div><div class="stat-card"><span>Page records</span><strong>{{stats.pages}}</strong></div></section><section class="table-card"><table><thead><tr><th>User</th><th>XP</th><th>VCoins</th><th>Created</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u['username']}}</td><td>{{u['xp']}}</td><td>{{u['virtual_coins']}}</td><td>{{u['created_at'][:19]}}</td></tr>{% endfor %}</tbody></table></section></div></body></html>
